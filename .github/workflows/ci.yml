name: CI

# Pokrece se samo kada se promijeni nesto sto utice na kod, testove, bazu ili Docker.
# README, screenshotovi i dokumentacija ne pokrecu pipeline.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".flake8"
      - "alembic.ini"
      - "alembic/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "**/*.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".flake8"
      - "alembic.ini"
      - "alembic/**"
      - "scripts/**"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (black, isort, flake8)
        run: |
          black --check app tests alembic scripts
          isort --check app tests alembic scripts
          flake8 app tests alembic scripts

      # SQLite u memoriji, Redis iskljucen, Celery red mockovan: Docker nije potreban.
      - name: Unit tests
        run: pytest --junitxml=TestResults/unit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: unit-test-results
          path: TestResults/*.xml
          if-no-files-found: ignore

  stack:
    name: Docker stack smoke test (PostgreSQL, Redis, Celery, Mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Start the stack
        run: docker compose up --build -d

      # Migracije na PostgreSQL-u, seed, login, narudzba i mail koji salje worker.
      - name: Smoke test
        run: bash scripts/smoke_test.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  release:
    name: Release (Docker image)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
